name: Publish npm Package

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Semantic Release"]
    types: [completed]

permissions:
  contents: read
  id-token: write

concurrency:
  group: npm-publish-${{ github.event.workflow_run.head_branch || github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion != 'cancelled')
    runs-on: ubuntu-latest
    steps:
      - name: Resolve release ref
        id: release-ref
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          release_tag="$(
            gh release view --repo "${GITHUB_REPOSITORY}" --json tagName --jq .tagName 2>/dev/null || true
          )"
          if [ -z "$release_tag" ]; then
            echo "Unable to resolve the latest GitHub release tag for npm publish." >&2
            exit 1
          fi
          echo "release_tag=$release_tag" >> "$GITHUB_OUTPUT"
          echo "Resolved release ref: $release_tag"
      - uses: actions/checkout@v6.0.2
        with:
          ref: ${{ github.event.workflow_run.head_branch || github.ref }}
          fetch-depth: 0
      - name: Verify release ref matches package version
        run: |
          set -euo pipefail
          release_tag="${{ steps.release-ref.outputs.release_tag }}"
          package_version="$(node -p "require('./packages/cli/package.json').version")"
          tag_version="${release_tag#v}"
          if [ "$package_version" != "$tag_version" ]; then
            echo "Checked out tag ${release_tag} but package.json is ${package_version}." >&2
            exit 1
          fi
          echo "Checked out ${release_tag} with matching package version ${package_version}."
      - uses: pnpm/action-setup@v6.0.9
      - uses: actions/setup-node@v6.4.0
        with:
          node-version: 22.14.0
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: Install npm 11
        run: npm install -g npm@^11.10.0
      - name: Configure private rules package access
        shell: bash
        env:
          CLOUDEVAL_SIGNALSTORY_RULES_SSH_KEY: ${{ secrets.CLOUDEVAL_SIGNALSTORY_RULES_SSH_KEY || secrets.SIGNALSTORY_RULES_SSH_KEY }}
          CLOUDEVAL_SIGNALSTORY_RULES_TOKEN: ${{ secrets.CLOUDEVAL_SIGNALSTORY_RULES_TOKEN || secrets.SIGNALSTORY_RULES_TOKEN }}
        run: bash scripts/configure-private-github-dependencies.sh
      - name: Install deps
        run: pnpm install --frozen-lockfile
      - name: Test npm package metadata
        run: pnpm test:npm-package
      - name: Audit production licenses
        run: |
          pnpm license:artifacts
          pnpm license:audit
      - name: Verify GitHub and npm versions before publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          release_tag="${{ steps.release-ref.outputs.release_tag }}"
          github_version="${release_tag#v}"
          npm_version="$(npm view @ganakailabs/cloudeval-cli version 2>/dev/null || true)"
          echo "github_version=$github_version"
          echo "npm_version=${npm_version:-none}"
          if [ -n "$npm_version" ] && [ "$github_version" != "$npm_version" ]; then
            echo "GitHub release (${github_version}) is ahead of npm (${npm_version}); publish is expected." >&2
          fi
      - name: Check whether npm publish is needed
        id: publish-needed
        run: |
          set -euo pipefail
          local_version=$(node -p "require('./packages/cli/package.json').version")
          published_version=$(npm view @ganakailabs/cloudeval-cli version 2>/dev/null || true)
          echo "local_version=$local_version"
          echo "published_version=${published_version:-none}"
          if [ "$local_version" != "$published_version" ]; then
            echo "should_publish=true" >> "$GITHUB_OUTPUT"
          else
            echo "should_publish=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Publish package
        if: steps.publish-needed.outputs.should_publish == 'true'
        working-directory: packages/cli
        env:
          CLOUDEVAL_APPLICATIONINSIGHTS_CONNECTION_STRING: ${{ secrets.CLOUDEVAL_APPLICATIONINSIGHTS_CONNECTION_STRING }}
          APPLICATIONINSIGHTS_CONNECTION_STRING: ${{ secrets.APPLICATIONINSIGHTS_CONNECTION_STRING }}
          NEXT_PUBLIC_APPLICATIONINSIGHTS_CONNECTION_STRING: ${{ secrets.NEXT_PUBLIC_APPLICATIONINSIGHTS_CONNECTION_STRING }}
        run: npm publish --access public
      - name: Verify GitHub and npm are in sync after publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          release_tag="${{ steps.release-ref.outputs.release_tag }}"
          github_version="${release_tag#v}"
          package_version="$(node -p "require('./packages/cli/package.json').version")"
          if [ "$github_version" != "$package_version" ]; then
            echo "GitHub tag and package.json diverged after publish." >&2
            exit 1
          fi
          npm_version=""
          for attempt in 1 2 3 4 5 6; do
            npm_version="$(npm view @ganakailabs/cloudeval-cli version 2>/dev/null || true)"
            echo "sync check attempt ${attempt}: github=${github_version} npm=${npm_version:-none}"
            if [ "$github_version" = "$npm_version" ]; then
              echo "GitHub release and npm are in sync at ${github_version}."
              exit 0
            fi
            sleep 15
          done
          echo "GitHub release (${github_version}) and npm (${npm_version:-none}) are out of sync after waiting for registry propagation." >&2
          exit 1
