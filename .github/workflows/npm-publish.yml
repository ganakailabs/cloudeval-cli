name: Publish npm Package

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Semantic Release"]
    types: [completed]

permissions:
  contents: read
  id-token: write

concurrency:
  group: npm-publish-${{ github.event.workflow_run.head_branch || github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.2
        with:
          ref: ${{ github.event.workflow_run.head_branch || github.ref }}
      - uses: pnpm/action-setup@v5.0.0
      - uses: actions/setup-node@v6.4.0
        with:
          node-version: 22.14.0
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: Install npm 11
        run: npm install -g npm@^11.10.0
      - name: Install deps
        run: pnpm install --frozen-lockfile
      - name: Test npm package metadata
        run: pnpm test:npm-package
      - name: Lint CLI
        run: pnpm -C packages/cli lint
      - name: Test CLI
        run: pnpm -C packages/cli test
      - name: Audit production licenses
        run: |
          pnpm license:artifacts
          pnpm license:audit
      - name: Check whether npm publish is needed
        id: publish-needed
        run: |
          local_version=$(node -p "require('./packages/cli/package.json').version")
          published_version=$(npm view @ganakailabs/cloudeval-cli version 2>/dev/null || true)
          echo "local_version=$local_version"
          echo "published_version=${published_version:-none}"
          if [ "$local_version" != "$published_version" ]; then
            echo "should_publish=true" >> "$GITHUB_OUTPUT"
          else
            echo "should_publish=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Publish package
        if: steps.publish-needed.outputs.should_publish == 'true'
        working-directory: packages/cli
        run: npm publish --access public
