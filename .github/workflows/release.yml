name: Release Binaries

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to upload assets to, for example v0.3.0"
        required: false
        type: string

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15-intel
            platform: macos
            arch: x64
          - os: macos-14
            platform: macos
            arch: arm64
          - os: ubuntu-latest
            platform: linux
            arch: x64
          - os: ubuntu-24.04-arm
            platform: linux
            arch: arm64
          - os: windows-latest
            platform: win
            arch: x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6.0.2
        with:
          ref: ${{ github.event.inputs.tag || github.ref_name }}
      - uses: pnpm/action-setup@v5.0.0
      - uses: actions/setup-node@v6.4.0
        with:
          node-version: 20
          cache: pnpm
      - uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version: "1.3.3"
      - name: Install deps
        run: pnpm install --frozen-lockfile
      - name: Test npm package metadata
        run: pnpm test:npm-package
      - name: Test CLI
        run: pnpm -C packages/cli test
      - name: Lint CLI
        run: pnpm -C packages/cli lint
      - name: Audit production licenses
        run: |
          pnpm license:artifacts
          pnpm license:audit
      - name: Build workspace deps
        run: |
          pnpm --filter @cloudeval/shared build
          pnpm --filter @cloudeval/core build
      - name: Build executable (bun)
        shell: bash
        env:
          CLOUDEVAL_APPLICATIONINSIGHTS_CONNECTION_STRING: ${{ secrets.CLOUDEVAL_APPLICATIONINSIGHTS_CONNECTION_STRING }}
          APPLICATIONINSIGHTS_CONNECTION_STRING: ${{ secrets.APPLICATIONINSIGHTS_CONNECTION_STRING }}
          NEXT_PUBLIC_APPLICATIONINSIGHTS_CONNECTION_STRING: ${{ secrets.NEXT_PUBLIC_APPLICATIONINSIGHTS_CONNECTION_STRING }}
        run: |
          mkdir -p packages/cli/dist/bin
          node scripts/inject-cli-telemetry-connection-string.mjs
          node packages/cli/scripts/patch-yoga-wasm.js
          YOGA_WASM=$(node packages/cli/scripts/prepare-yoga-wasm.js)
          if [ "${{ matrix.platform }}" = "win" ]; then
            bun build packages/cli/src/cli.tsx --compile --outfile packages/cli/dist/bin/cloudeval-win-${{ matrix.arch }}.exe
          else
            bun build packages/cli/src/cli.tsx --compile --outfile packages/cli/dist/bin/cloudeval
            mv packages/cli/dist/bin/cloudeval packages/cli/dist/bin/cloudeval-${{ matrix.platform }}-${{ matrix.arch }}
          fi
          cp "$YOGA_WASM" packages/cli/dist/bin/yoga.wasm
          rm -f "$YOGA_WASM"
          node packages/cli/scripts/alias-executables.js
          if [ "${{ matrix.platform }}-${{ matrix.arch }}" != "linux-x64" ]; then
            rm -f packages/cli/dist/bin/yoga.wasm
          fi
      - name: Copy license artifacts
        shell: bash
        run: |
          cp LICENSE NOTICE THIRD_PARTY_NOTICES.md sbom.spdx.json packages/cli/dist/bin/
      - name: Create compressed assets
        shell: bash
        run: |
          cd packages/cli/dist/bin
          for file in *; do
            [ -f "$file" ] || continue
            case "$file" in
              *.sha256|*.gz) continue ;;
            esac
            gzip -9 -k "$file"
          done
      - name: Generate checksums
        shell: bash
        run: |
          cd packages/cli/dist/bin
          node - <<'NODE'
          const crypto = require("node:crypto");
          const fs = require("node:fs");
          for (const file of fs.readdirSync(".")) {
            if (file.endsWith(".sha256")) continue;
            const stat = fs.statSync(file);
            if (!stat.isFile()) continue;
            const hash = crypto.createHash("sha256").update(fs.readFileSync(file)).digest("hex");
            fs.writeFileSync(`${file}.sha256`, `${hash}  ${file}\n`);
          }
          NODE
      - name: Upload release assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: gh release upload "$RELEASE_TAG" packages/cli/dist/bin/* --clobber
