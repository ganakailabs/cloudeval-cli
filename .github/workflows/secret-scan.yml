name: Secret scan

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "23 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  security-scan:
    name: Security scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v6.0.9

      - name: Setup Node
        uses: actions/setup-node@v6.4.0
        with:
          node-version: 20

      - name: Run repository security scan
        run: pnpm security:scan

  dependency-audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v6.0.9

      - name: Setup Node
        uses: actions/setup-node@v6.4.0
        with:
          node-version: 20

      - name: Configure private rules package access
        shell: bash
        env:
          CLOUDEVAL_SIGNALSTORY_RULES_SSH_KEY: ${{ secrets.CLOUDEVAL_SIGNALSTORY_RULES_SSH_KEY || secrets.SIGNALSTORY_RULES_SSH_KEY }}
          CLOUDEVAL_SIGNALSTORY_RULES_TOKEN: ${{ secrets.CLOUDEVAL_SIGNALSTORY_RULES_TOKEN || secrets.SIGNALSTORY_RULES_TOKEN }}
        run: bash scripts/configure-private-github-dependencies.sh

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Audit dependencies
        run: pnpm audit --audit-level high

      - name: Check license artifacts
        run: pnpm license:check

      - name: Audit production licenses
        run: pnpm license:audit
